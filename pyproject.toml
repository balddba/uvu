[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uvu"
version = "0.2.0"
description = "Check and update uv-managed project dependencies with optional pyproject pinning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]
dependencies = [
    "tabulate>=0.9.0",
    "packaging>=22.0",
]

[project.scripts]
update-uv-packages = "uvu.cli:main"
uvu = "uvu.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["src/uvu"]

[dependency-groups]
dev = [
    "loguru>=0.7.3",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.publish]
version_files = [
    "src/uvu/__init__.py",
]

[tool.pytest.ini_options]
addopts = "--cov=uvu --cov-report=term-missing"
pythonpath = ["src"]


